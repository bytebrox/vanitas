# Publish the Vanitas CLI to npm when you push a tag: cli-v1.6.1
# Prereq: GitHub repo secret NPM_TOKEN (npm Automation token)

name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to publish cli/package.json version to npm'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG="${GITHUB_REF_NAME#cli-v}"
          PKG="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag cli-v$TAG does not match cli/package.json version $PKG"
            exit 1
          fi

      - name: Confirm manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Set confirm input to exactly: publish"
            exit 1
          fi

      # A tag can be re-pointed after the fact, which replays this workflow.
      # npm rejects a duplicate version, so check before trying.
      - name: Check npm for this version
        id: published
        run: |
          if npm view "vanitas@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
            echo "vanitas@${{ steps.ver.outputs.version }} was already on npm; nothing to publish."
          else
            echo "Published vanitas@${{ steps.ver.outputs.version }}"
          fi
          echo "Try: npx vanitas@${{ steps.ver.outputs.version }} --help"
