# Build web app (workers + Next.js) and CLI on every push/PR to main

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # The forges refuse to run a worker whose hash differs from the one
      # compiled into the app, and the audit page tells visitors to compare
      # against the committed copy. Both only hold if it is actually current.
      # Only the hashes are compared; the build timestamp changes every run.
      - name: Worker integrity hashes are current
        run: |
          hashes() {
            node -e '
              const m = require("./public/worker-hash.json");
              const pick = (o) => o.hash;
              const out = { solana: pick(m) };
              for (const [k, v] of Object.entries(m)) {
                if (v && typeof v === "object") out[k] = pick(v);
              }
              console.log(JSON.stringify(out, Object.keys(out).sort(), 2));
            '
          }
          hashes > /tmp/worker-hashes-committed.json
          npm run build:worker
          hashes > /tmp/worker-hashes-rebuilt.json
          diff -u /tmp/worker-hashes-committed.json /tmp/worker-hashes-rebuilt.json && exit 0
          echo "::error::Worker hashes are stale — run 'npm run build:worker' and commit the result."
          exit 1

      - name: Build workers + Next.js
        run: npm run build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Build CLI
        run: npm run build
